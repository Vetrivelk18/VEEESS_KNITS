name: Deploy
# Runs on every push to main, and when an admin presses "Publish storefront"
# (the Worker sends a repository_dispatch event of type publish-storefront).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish-storefront]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_SOURCE: remote
      PUBLIC_MEDIA_BASE: /media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refuse local-only settings in production config
        run: npm run check:prod
      - run: npm run typecheck
      - run: npm test
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply veeess_db --remote
      - name: Build (exports live catalogue from D1, then builds static pages)
        run: npm run build
      - name: Deploy Worker + static assets
        run: npx wrangler deploy
